name: BBU Short Scanner

on:
  # 1. Chạy theo lịch trình (Cronjob)
  # Ví dụ: Chạy mỗi tiếng một lần vào phút thứ 0
  schedule:
    - cron: '0 * * * *'

  # 2. Cho phép kích hoạt thủ công từ giao diện GitHub hoặc gọi API từ web bên ngoài
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ repository
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Giúp cache node_modules để tăng tốc lần chạy sau

      # Bước 3: Cài đặt dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Bước 4: Chạy file BBU.js với các biến môi trường
      - name: Run BBU.js script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node BBU.js

      # Bước 5: Lưu lại lịch sử gửi tin nhắn (sent_ema.json và statetop_15d.json)
      - name: Commit and push updated JSON state files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ema.json statetop_15d.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: update scanner state logs [skip ci]"
          git push
