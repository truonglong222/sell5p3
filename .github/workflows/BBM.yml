name: BBM Short Scanner

on:
  repository_dispatch:
    types: [trigger-bbu-scan]
  workflow_dispatch:

# BẮT BUỘC: Cấp quyền ghi để bot có thể git push file json lên repo
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run BBM.js script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node BBM.js

      - name: Commit and push updated state files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 24h.json sent_ema.json || true
          git diff-index --quiet HEAD || (git commit -m "chore: update scanner state files [skip ci]" && git pull --rebase origin main && git push origin main)
