name: BBM Short Scanner

on:
  # 1. Kích hoạt từ bên thứ 3 (cron-job.org) qua API Hook
  repository_dispatch:
    types: [trigger-bbu-scan]

  # 2. Cho phép kích hoạt thủ công từ giao diện GitHub Actions
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Bước 3: Cài đặt dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Bước 4: Chạy file BBM.js với các biến môi trường
      - name: Run BBM.js script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node BBM.js

      # Bước 5: Lưu lại lịch sử dữ liệu (chỉ lưu 24h.json)
      - name: Commit and push updated 24h.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 24h.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: update scanner state 24h.json [skip ci]"
          git push
